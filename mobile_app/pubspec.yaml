name: arogyaai_app
description: AI-powered rural healthcare assistant with multilingual symptom checker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.0
  
  # Local Storage (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Speech & Voice
  speech_to_text: ^7.3.0
  # flutter_tts: ^4.2.4  # Temporarily disabled due to plugin issue
  
  # IoT / Bluetooth
  flutter_blue_plus: ^1.31.0
  
  # Networking
  http: ^1.2.0
  connectivity_plus: ^5.0.0
  
  # Utilities
  permission_handler: ^11.0.0
  intl: ^0.19.0
  share_plus: ^7.0.0
  path_provider: ^2.1.0
  uuid: ^4.3.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/
    - assets/rules/
    - assets/translations/
  
  # fonts:
  #   - family: NotoSans
  #     fonts:
  #       - asset: assets/fonts/NotoSans-Regular.ttf
  #       - asset: assets/fonts/NotoSans-Bold.ttf
  #         weight: 700
